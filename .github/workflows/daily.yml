name: 每日更新涨星榜

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:   # 也允许在 Actions 页手动点一次「Run workflow」

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 GitHub 官方 Trending 并生成数据
        run: |
          if python collect.py --no-push; then
            echo "抓取并生成数据完成"
          else
            echo "第一次没抓成，30 秒后重试一次"
            sleep 30
            python collect.py --no-push
          fi

      - name: 记录本次运行
        if: always()
        run: |
          mkdir -p data
          echo "time_utc=$(date -u '+%Y-%m-%d %H:%M:%S')" > data/last_run.txt
          echo "status=${{ job.status }}" >> data/last_run.txt

      - name: 提交新数据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore: 更新 $(date -u +%F) 榜单"
            git push
          fi

      # GitHub 官方限制：用 GITHUB_TOKEN 推送的提交不会触发 Pages 重新构建。
      # 所以数据提交后，必须主动请求一次构建，网页才会显示新数据。
      - name: 刷新网页（触发 Pages 重新发布）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "Pages build HTTP: $code"
          cat /tmp/pages.json || true
          # 201 = 已排队；失败只警告，不影响数据已经写入仓库
          if [ "$code" != "201" ]; then
            echo "::warning::未能自动触发 Pages 构建（HTTP $code），数据已写入仓库，可稍后在 Pages 页手动重试"
          fi
