<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>涨星榜 · GitHub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="涨星榜">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#faf9f7; --surface:#ffffff; --line:#e9e7e2; --line-soft:#f1efeb;
  --ink:#191b1f; --ink-2:#5c6068; --ink-3:#9a9da5;
  --up:#d63b34; --up-soft:#fdf0ef; --link:#1d4ed8;
  --gold:#b8862b; --shadow:0 1px 2px rgba(20,22,26,.04),0 6px 20px rgba(20,22,26,.035);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161a; --surface:#1d2026; --line:#2c3038; --line-soft:#262a31;
    --ink:#f2f3f5; --ink-2:#a7abb4; --ink-3:#71757e;
    --up:#ff6b62; --up-soft:#2b1e1e; --link:#7ea2ff;
    --gold:#e0bd6a; --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
header{margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--ink-3);text-transform:uppercase}
h1{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:10px 0 8px;font-weight:700}
.meta{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta .dot{color:var(--ink-3)}

.statusbar{
  display:flex;align-items:center;gap:9px;padding:11px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  font-size:13px;color:var(--ink-2);min-height:46px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status-dot.ok{background:#37a467}
.status-dot.busy{background:#e0a23a;animation:pulse 1.1s infinite}
.status-dot.warn{background:#e0733a}
@keyframes pulse{50%{opacity:.35}}
#statusText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#refreshBtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;flex:none;
}
#refreshBtn:active{background:var(--line-soft)}
#refreshBtn:disabled{opacity:.45;cursor:default}
.progress{height:2px;background:transparent;overflow:hidden;margin:0 14px;border-radius:2px}
.progress.on{background:var(--line-soft)}
.progress-bar{height:100%;width:0;background:var(--up);transition:width .35s ease}

.tabs{
  display:inline-flex;gap:3px;padding:3px;margin-bottom:14px;
  background:var(--line-soft);border:1px solid var(--line);border-radius:10px;
}
.tab{
  border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;
  padding:7px 18px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,26,.08)}
.chart-card{
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:18px 16px 16px;margin-top:18px;box-shadow:var(--shadow);
}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chart-title{font-size:15px;font-weight:650;letter-spacing:-.01em}
.chart-sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.sort-switch{display:inline-flex;gap:2px;padding:2px;background:var(--line-soft);border-radius:8px;flex:none}
.sort-switch button{
  border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;
  padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.sort-switch button.on{background:var(--surface);color:var(--up);font-weight:600}
.sort-hint{font-size:12.5px;color:var(--ink-2);margin:20px 2px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sort-hint b{color:var(--up);font-weight:650}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12px}
.chart-rank{width:20px;flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chart-name{width:132px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.chart-track{flex:1;min-width:40px;height:14px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.chart-bar{height:100%;background:var(--up);border-radius:4px;transition:width .45s ease}
.chart-val{width:76px;flex:none;text-align:right;color:var(--up);font-weight:650;font-variant-numeric:tabular-nums}
.chart-note{font-size:11.5px;color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);line-height:1.6}
.line-svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.legend-item{display:inline-flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-val{color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 今日榜：每日涨幅 */
.daily-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 2px 0}
.daily-title{font-size:13.5px;color:var(--ink-2);font-weight:600}
.daily-title b{color:var(--up);font-weight:650}
#dailyPanel .chart-note{margin-top:8px;padding-top:0;border-top:0}
.dgain{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.dg-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;line-height:1.7}
.dg-k{color:var(--ink-3);flex:none}
.dg-v{color:var(--up);font-weight:700;font-variant-numeric:tabular-nums}
.dg-v.na{color:var(--ink-3);font-weight:600}
.dg-s{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.dg-track{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.dg-bar{height:100%;background:var(--up);border-radius:3px;transition:width .45s ease;opacity:.85}

main{margin-top:18px}
.card{
  display:flex;align-items:flex-start;gap:14px;position:relative;
  padding:18px 16px 18px 14px;margin-bottom:10px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease;
}
.card:active{transform:scale(.988);border-color:var(--ink-3)}
.card.podium:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--gold);opacity:.75}
.rank{
  font-size:25px;font-weight:750;letter-spacing:-.04em;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.1;width:34px;flex:none;padding-top:1px;
}
.card.podium .rank{color:var(--ink)}
.body{flex:1;min-width:0}
.title{font-size:16px;font-weight:650;letter-spacing:-.01em;word-break:break-word;line-height:1.35}
.title .owner{color:var(--ink-3);font-weight:500}
.desc{font-size:13px;color:var(--ink-2);margin:5px 0 0;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.tags .lang{display:inline-flex;align-items:center;gap:5px}
.tags .swatch{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.tags .total{font-variant-numeric:tabular-nums}
.gain{text-align:right;flex:none;padding-top:1px;min-width:78px}
.gain-num{font-size:21px;font-weight:750;color:var(--up);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.15}
.gain-num .approx{font-size:11px;font-weight:600;margin-left:2px;color:var(--ink-3)}
.gain-label{font-size:11px;color:var(--ink-3);margin-top:3px}
.arrow{position:absolute;right:14px;bottom:14px;font-size:13px;color:var(--ink-3);opacity:.55}

.empty{text-align:center;padding:56px 20px;color:var(--ink-2);font-size:14px;line-height:1.8}
footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.75}
footer p{margin:0 0 5px}

@media (max-width:560px){
  .wrap{padding-left:14px;padding-right:14px}
  h1{font-size:26px}
  .card{gap:10px;padding:15px 12px 15px 11px}
  .rank{font-size:20px;width:26px}
  .title{font-size:14.5px}
  .gain-num{font-size:18px}
  .gain{min-width:66px}
  .arrow{display:none}
  .tab{padding:7px 14px}
  .chart-card{padding:15px 12px}
  .chart-name{width:88px}
  .chart-val{width:66px}
  .chart-row{gap:7px}
  .daily-head{gap:8px}
  .daily-title{font-size:12.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">GitHub · Trending</div>
    <h1>涨星榜</h1>
    <div class="meta"><span id="dateLabel">—</span><span class="dot">·</span><span id="scopeLabel">近 24 小时新增星数 Top 10</span></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" type="button" data-view="daily">今日</button>
    <button class="tab" type="button" data-view="weekly">近 7 天</button>
  </div>

  <div class="statusbar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">正在准备数据…</span>
    <button id="refreshBtn" type="button">刷新</button>
  </div>
  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

  <section id="chartPanel" hidden>
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">近 7 天新增星数对比</div>
          <div class="chart-sub" id="chartSub">Top 10 · 按新增星数排序</div>
        </div>
        <div class="sort-switch" id="sortSwitch">
          <button type="button" data-sort="gain" class="on">按新增星数</button>
          <button type="button" data-sort="pct">按增幅 %</button>
        </div>
      </div>
      <div id="chart"></div>
      <div class="chart-note" id="chartNote"></div>
    </div>
  </section>

  <section id="linePanel" hidden>
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <div class="chart-title">近 7 天总星数走势</div>
          <div class="chart-sub" id="lineSub">前 5 名 · 纵轴单位 k</div>
        </div>
      </div>
      <div id="lineChart"></div>
      <div class="chart-note" id="lineNote"></div>
      <div class="chart-legend" id="lineLegend"></div>
    </div>
  </section>

  <section id="dailyPanel">
    <div class="daily-head">
      <div class="daily-title">今日榜 · 每项下方为<b>每日涨幅</b></div>
      <div class="sort-switch" id="dailySortSwitch">
        <button type="button" data-sort="gain" class="on">按今日新增</button>
        <button type="button" data-sort="pct">按今日涨幅 %</button>
      </div>
    </div>
    <p class="chart-note" id="dailyNote">每日涨幅 = 今日新增星数 ÷ 昨日星数。昨日星数来自前一天的实测快照；标「无昨日数据」的条目是新进榜、前一天没记录到，不做估算。</p>
  </section>

  <div class="sort-hint" id="sortHint"></div>

  <main id="list"><div class="empty">正在读取榜单…</div></main>


  <footer>
    <p id="footNote">数据来源以榜单页脚标注为准。</p>
    <p id="updatedAt"></p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
